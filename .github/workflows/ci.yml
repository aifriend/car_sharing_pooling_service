name: CI
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            service/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r service/requirements.txt -r requirements-dev.txt
      - name: Ruff (syntax + undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Byte-compile all sources
        run: python -m compileall -q -x '\.git' .
      - name: Tests
        run: pytest service/test -q
